spring:
  application:
    name: Online-Quiz_Application

  datasource:
    url: jdbc:postgresql://localhost:5432/quiz_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
